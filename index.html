<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Gurukul Live Class</title>

<style>
body{
    margin:0;
    background:#0d1117;
    color:white;
    font-family:Segoe UI, sans-serif;
}

header{
    background:#161b22;
    padding:12px 25px;
    text-align:center;
}

header h1{
    color:#ffbf00;
    margin:0;
}

.live-box{
    max-width:900px;
    margin:40px auto;
    padding:20px;
    background:#121824;
    border-radius:14px;
    box-shadow:0 8px 22px rgba(0,0,0,.6);
    text-align:center;
}

.live-title{
    font-size:1.8rem;
    color:#ffbf00;
    font-weight:700;
}

.video-frame{
    margin-top:15px;
    width:100%;
    height:500px;
    border-radius:14px;
    overflow:hidden;
}

.video-frame iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<header>
    <h1>MD GURUKUL – LIVE CLASS</h1>
</header>

<div class="live-box">
    <div class="live-title">📡 LIVE CLASS</div>

    <div class="video-frame">
        <iframe
            src="https://www.youtube.com/embed/live_stream?channel=UCRh_MHpdDo9zHwxa9Xu_t2w&autoplay=1&mute=1"
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>
    </div>
</div>

</body>
</html>
