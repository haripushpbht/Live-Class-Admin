<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Gurukul Live Class</title>

<style>
body{
    margin:0;
    background:#0d1117;
    color:white;
    font-family:Segoe UI, sans-serif;
}
header{
    background:#161b22;
    padding:12px 25px;
    text-align:center;
}
header h1{
    color:#ffbf00;
    margin:0;
}
.live-box{
    max-width:900px;
    margin:40px auto;
    padding:20px;
    background:linear-gradient(to right, #121824, #0d1117);
    border-radius:14px;
    box-shadow:0 8px 22px rgba(0,0,0,.6);
    text-align:center;
    backdrop-filter:blur(5px);
}
.live-title{
    font-size:1.8rem;
    color:#ffbf00;
    font-weight:700;
}
.video-frame{
    margin-top:15px;
    width:100%;
    height:500px;
    border-radius:14px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.05);
    display:flex;
    align-items:center;
    justify-content:center;
}
.video-frame iframe{
    width:100%;
    height:100%;
    border:none;
}
.waiting-banner{
    font-size:1.4rem;
    font-weight:700;
    color:#000;
    background: linear-gradient(135deg, #ffbf00, #e69100);
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    border-radius:14px;
}
.admin-panel{
    max-width:900px;
    margin:20px auto;
    text-align:center;
}
.admin-panel input{
    padding:8px;
    width:60%;
    border-radius:6px;
    border:none;
    margin-right:10px;
}
.admin-panel button{
    padding:8px 15px;
    background:#ffbf00;
    border:none;
    font-weight:bold;
    cursor:pointer;
    border-radius:6px;
}
footer{
    text-align:center;
    padding:20px;
    margin-top:30px;
    background:#161b22;
    font-weight:600;
}
</style>
</head>

<body>

<header>
    <h1>MD GURUKUL – LIVE CLASS</h1>
</header>

<div class="live-box">
    <div class="live-title">📡 LIVE CLASS</div>

    <div class="video-frame" id="videoArea">
        <div class="waiting-banner">🚀 Class Will Start Soon!<br>Stay Ready Students!</div>
    </div>
</div>

<div class="admin-panel">
    <input type="text" id="liveInput" placeholder="Paste YouTube Video ID here">
    <button onclick="saveLiveID()">Set Live Video</button>
</div>

<footer>
    © 2025 MD Gurukul - All Rights Reserved
</footer>

<script>
// Function to load live video from localStorage
function loadLive(){
    const savedID = localStorage.getItem('liveVideoID');
    if(savedID){
        document.getElementById("videoArea").innerHTML = `
            <iframe 
                src="https://www.youtube.com/embed/${savedID}?autoplay=1&mute=1&rel=0" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
            </iframe>`;
    }
}

// Function for admin to save live video ID
function saveLiveID(){
    const id = document.getElementById('liveInput').value.trim();
    if(id === ""){
        alert("Please enter a valid Video ID");
        return;
    }
    localStorage.setItem('liveVideoID', id);
    loadLive();
}

// Load video automatically when page opens
loadLive();
</script>

</body>
</html>
