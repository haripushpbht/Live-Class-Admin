<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Gurukul Live Class</title>

<style>
body {
    margin: 0;
    background-color: #0d1117;
    color: #ffffff;
    font-family: "Segoe UI", sans-serif;
}

header {
    background: #161b22;
    padding: 12px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

header h1 {
    color: #ffbf00;
    margin: 0;
}

.live-box {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
    background: #121824;
    border-radius: 14px;
    box-shadow: 0 8px 22px rgba(0,0,0,.6);
    text-align: center;
}

.live-title {
    font-size: 1.8rem;
    color: #ffbf00;
    font-weight: 700;
}

.glass-frame {
    margin-top: 15px;
    width: 100%;
    height: 500px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.15);
}

.glass-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.waiting-banner {
    height: 100%;
    background: linear-gradient(135deg, #ffbf00, #e69500);
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 700;
    text-transform: uppercase;
}
</style>
</head>

<body>

<header>
    <h1>MD GURUKUL – LIVE CLASS</h1>
</header>

<div class="live-box">
    <div class="live-title">📡 LIVE CLASS</div>
    <div id="videoArea" class="glass-frame">
        <div class="waiting-banner">⏳ Checking Live Status...</div>
    </div>
</div>

<script>
/* ============================
   CONFIG – CHANGE ONLY THIS
=============================== */
const API_KEY = "AIzaSyB3_Sdvg5sc-VtLtp-saCGQ9NZ9z-0WgL4";        // 🔐 Restrict this
const CHANNEL_ID = "UCRh_MHpdDo9zHwxa9Xu_t2w"; // Your YouTube channel

async function checkLive() {
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=live&type=video&key=${API_KEY}`;

    try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.items && data.items.length > 0) {
            const liveId = data.items[0].id.videoId;

            document.getElementById("videoArea").innerHTML = `
                <iframe 
                    src="https://www.youtube.com/embed/${liveId}?autoplay=1&mute=1&rel=0"
                    allow="autoplay; encrypted-media"
                    allowfullscreen>
                </iframe>`;
        } else {
            document.getElementById("videoArea").innerHTML = `
                <div class="waiting-banner">
                    🚀 Class Will Start Soon
                </div>`;
        }
    } catch (err) {
        document.getElementById("videoArea").innerHTML = `
            <div class="waiting-banner">
                ⚠ Unable to Load Live
            </div>`;
    }
}

checkLive();
setInterval(checkLive, 30000);
</script>

</body>
</html>
